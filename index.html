<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Leilão EA FC 26</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="main-header">
    <div class="nav-content">
      <div class="brand">
        <span class="site-title">Leilão EA FC 26</span>
      </div>
      <button id="btnLogout" class="logout-btn hidden">Sair</button>
    </div>
  </header>

  <main>
    <!-- Nome de entrada -->
    <section id="entrySection" class="glass-card glass-card-center animated">
      <h2>Bem-vindo ao <span class="accent">Leilão EA FC 26</span></h2>
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" id="userNameInput" placeholder="Seu nome" autocomplete="off"/>
      </div>
      <button class="main-btn" onclick="enterAuction()">Entrar</button>
      <p class="tip">Digite <b>ADM</b> para painel administrativo</p>
    </section>

    <!-- Painel ADM: Jogadores e saldo de usuários -->
    <section id="adminPanel" class="glass-card glass-card-center hidden animated">
      <h2>Painel do <span class="accent">Administrador</span></h2>
      <form id="addUserForm" class="flex-col">
        <h3 style="margin-bottom:7px;">Definir saldo dos participantes</h3>
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input type="text" id="admUserName" placeholder="Nome do participante" required autocomplete="off"/>
          <span class="input-icon">💰</span>
          <input type="number" id="admUserMoney" placeholder="Saldo" required min="1"/>
        </div>
        <button type="submit" class="main-btn">Adicionar/Atualizar saldo</button>
      </form>
      <div id="userMoneyList" class="list-box"></div>

      <form id="addPlayerForm" class="flex-col" style="margin-top:28px;">
        <h3 style="margin-bottom:8px;">Adicionar jogador à lista</h3>
        <div class="input-group">
          <span class="input-icon">🎯</span>
          <input type="text" id="playerName" placeholder="Nome do Jogador" required autocomplete="off"/>
        </div>
        <div class="input-group">
          <span class="input-icon">🏅</span>
          <input type="number" id="playerOverall" placeholder="Overall EA FC" required min="50" max="99"/>
        </div>
        <div class="input-group">
          <span class="input-icon">⚡</span>
          <input type="number" id="playerPace" placeholder="Ritmo" required min="1" max="99"/>
          <span class="input-icon">💪</span>
          <input type="number" id="playerDef" placeholder="Defesa" required min="1" max="99"/>
        </div>
        <div class="input-group">
          <span class="input-icon">🅿️</span>
          <input type="text" id="playerPosition" placeholder="Posição (ex: GOL, ATA)" required/>
        </div>
        <button type="submit" class="main-btn">Adicionar Jogador</button>
      </form>
      <div id="adminPlayersList" class="list-box"></div>
      <h3 style="margin:18px 0 8px 0;">Seleção de jogadores para o leilão</h3>
      <div id="leilaoSelectList" class="list-box"></div>
      <button class="main-btn" onclick="iniciarLeilao()" style="margin-top:10px;">Iniciar Leilão</button>
    </section>

    <!-- Painel de Leilão -->
    <section id="auctionPanel" class="glass-card glass-card-center hidden animated">
      <h2><span class="accent">Leilão de Jogadores EA FC</span></h2>
      <div id="auctionPlayerCard"></div>
      <div class="input-group">
        <span class="input-icon">💸</span>
        <input type="number" id="bidValue" min="1" placeholder="Seu lance"/>
        <button class="main-btn" onclick="placeBid()">Dar Lance</button>
        <button class="main-btn outline" onclick="passBid()" id="passBtn">Passar</button>
      </div>
      <div id="bidsList" class="list-box"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="script.js"></script>
</body>
</html>
