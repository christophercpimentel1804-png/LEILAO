<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Leilão de Jogadores</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="light">
  <header>
    <h1>Leilão de Jogadores</h1>
    <button id="themeToggle" aria-label="Alternar tema">🌙</button>
  </header>

  <!-- Login/Cadastro -->
  <section id="loginSection" class="glass">
    <h2>Login</h2>
    <input type="email" placeholder="Email" id="loginEmail"/>
    <input type="password" placeholder="Senha" id="loginPassword"/>
    <button onclick="login()">Entrar</button>
  </section>

  <!-- Dashboard ADM (apenas exibido se ADM logado) -->
  <section id="adminDashboard" class="glass hidden">
    <h2>Painel do Administrador</h2>
    <form id="auctionForm">
      <input type="text" placeholder="Nome do Leilão" required />
      <input type="number" placeholder="Valor Base" required />
      <select>
        <option>Tempo: 60s</option>
        <option>Tempo: 90s</option>
        <option>Tempo: 120s</option>
      </select>
      <button type="submit">Criar Leilão</button>
    </form>
    <div id="auctionsList"></div>
  </section>

  <!-- Página de Leilão -->
  <section id="auctionSection" class="glass hidden">
    <h2>Leilão Ativo</h2>
    <div id="playerAuctionCard"></div>
    <label>
      Lance:
      <input type="number" id="bidValue"/>
      <button onclick="placeBid()">Dar Lance</button>
    </label>
    <div id="bidsList"></div>
    <button onclick="closeAuction()">Encerrar Leilão</button>
  </section>

  <!-- Ranking de Times -->
  <section id="rankingSection" class="glass hidden">
    <h2>Ranking de Times</h2>
    <div id="teamsRanking"></div>
  </section>

  <!-- Notificação flutuante -->
  <div id="notification" class="hidden"></div>

  <script src="script.js"></script>
</body>
</html>
