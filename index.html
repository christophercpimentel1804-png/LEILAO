<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Leilão FC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="logo_leilao_fc.jpg" alt="Logo do Leilão" id="siteLogo" onerror="this.style.display='none'; alert('Imagem logo_leilao_fc.jpg não carregou. Confira nome e pasta!')">
    <h1>Leilão FC</h1>
    <button id="btnLogout" class="logout hidden">Sair</button>
  </header>

  <!-- Entrada pelo nome -->
  <section id="entrySection" class="glass">
    <h2>Entre com seu nome:</h2>
    <input type="text" id="userNameInput" placeholder="Seu nome" autocomplete="off"/>
    <button onclick="enterAuction()">Entrar</button>
  </section>

  <!-- Aba ADM -->
  <section id="adminPanel" class="glass hidden">
    <h2>Painel do Administrador</h2>
    <form id="addPlayerForm">
      <input type="text" id="playerName" placeholder="Nome do Jogador" required autocomplete="off"/>
      <input type="number" id="playerValue" placeholder="Valor Inicial" required min="1"/>
      <button type="submit">Adicionar Jogador</button>
    </form>
    <div id="adminPlayersList"></div>
  </section>

  <!-- Painel de Leilão -->
  <section id="auctionPanel" class="glass hidden">
    <h2>Leilão de Jogadores</h2>
    <div id="auctionPlayerCard"></div>
    <label>
      Lance:
      <input type="number" id="bidValue" min="1"/>
      <button onclick="placeBid()">Dar Lance</button>
      <button onclick="passBid()" class="passBtn">Passar</button>
    </label>
    <div id="bidsList"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
